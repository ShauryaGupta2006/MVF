<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Pure Luxury Royal Blue -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="60%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>

    <!-- Subtle Radial Glow in Center -->
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0" />
    </radialGradient>

    <!-- Precision Border Rim -->
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.3" />
    </linearGradient>

    <!-- Drop Shadow for Letters -->
    <filter id="v-depth" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Squircle Container -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bg)" stroke="url(#border)" stroke-width="6" />
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#glow)" />

  <!-- Inner Inset Border -->
  <rect x="40" y="40" width="432" height="432" rx="96" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2" />

  <!-- MVF Typographic Mark -->
  <!-- M (Sky Blue), V (Pure Black), F (Sky Blue) -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Outfit', 'Plus Jakarta Sans', 'Inter', 'SF Pro Display', sans-serif" font-weight="900" font-size="172" letter-spacing="-6" text-anchor="middle" dominant-baseline="central">
    
    <!-- Letter M (Sky Blue) -->
    <text x="146" y="260" fill="#38bdf8">M</text>

    <!-- Letter V (Pitch Black with depth) -->
    <text x="256" y="260" fill="#09090b" filter="url(#v-depth)">V</text>

    <!-- Letter F (Sky Blue) -->
    <text x="366" y="260" fill="#38bdf8">F</text>
  </g>
</svg>
