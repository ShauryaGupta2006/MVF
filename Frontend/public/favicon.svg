<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181528"/>
      <stop offset="50%" stop-color="#0e0c15"/>
      <stop offset="100%" stop-color="#07060a"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#7c3aed" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Text Glow Gradient -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#ede9fe"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>

    <!-- Accent Spark Gradient -->
    <linearGradient id="spark-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Subtle Outer Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="text-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#7c3aed" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect x="16" y="16" width="480" height="480" rx="100" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="8" />

  <!-- Inner Ambient Glow Ring -->
  <rect x="28" y="28" width="456" height="456" rx="88" fill="none" stroke="#a78bfa" stroke-opacity="0.15" stroke-width="2"/>

  <!-- Live Pulse Dot Badge (Top Right) -->
  <circle cx="410" cy="102" r="18" fill="#10b981" filter="url(#glow)"/>
  <circle cx="410" cy="102" r="10" fill="#ecfdf5"/>

  <!-- Main MVF Typography -->
  <g filter="url(#text-shadow)">
    <text 
      x="256" 
      y="320" 
      font-family="'Plus Jakarta Sans', 'Outfit', 'Inter', 'SF Pro Display', system-ui, -apple-system, sans-serif" 
      font-weight="900" 
      font-size="168" 
      letter-spacing="-4" 
      text-anchor="middle" 
      fill="url(#text-grad)"
    >MVF</text>
  </g>

  <!-- Film / AI Predictive Spark Notch (Above M) -->
  <polygon points="155,105 163,125 183,133 163,141 155,161 147,141 127,133 147,125" fill="url(#spark-grad)"/>
</svg>